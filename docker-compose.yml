# Local development stack. For production, replace the `mongo` service
# with MongoDB Atlas and set MONGO_URI in backend/.env and ml-service/.env.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    env_file: ./ml-service/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/parqco
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/parqco
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ORIGIN=http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - ml-service

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
